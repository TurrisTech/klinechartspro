server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The chart bundle is ~650 KB of JS before compression — the dominant cost of a cold
    # load on this page, and nginx does not compress anything but text/html by default.
    gzip on;
    gzip_types application/javascript application/json text/css image/svg+xml;
    gzip_min_length 1024;

    # Bundle filenames carry a content hash (scripts/build-client.ts), so a given URL's body
    # never changes and may be cached indefinitely.
    # Quoted because the regex contains {8,}: nginx reads an unquoted `{` in a location
    # pattern as the start of a config block and dies with "unknown directive".
    location ~* "-[a-z0-9]{8,}\.(js|css|map|woff2?)$" {
        # One Cache-Control only. `expires 1y` emits its own, so pairing it with an
        # add_header sends the header twice with different values.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Chart tiles: immutable Parquet bar history, proxied straight from the SeaweedFS S3
    # gateway so the browser reads history from object storage instead of /getbars. Serving it
    # here rather than as its own Ingress is not a shortcut -- it is the only seam left. This
    # cluster's Traefik runs without allowExternalName and without allowCrossNamespace, so
    # neither an ExternalName backend nor a cross-namespace IngressRoute reaches another
    # namespace; and ArgoCD's resource.exclusions drops Endpoints and EndpointSlice, so a
    # selector-less Service cannot be given endpoints either. nginx already owns `/` on this
    # host, so same-origin comes free and no shared infrastructure has to change.
    #
    # The bucket name lives here rather than in the URL the client builds: the client asks for
    # /tiles/v1/..., which keeps the bucket an implementation detail it never has to know.
    location /tiles/ {
        proxy_pass http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333/marketdata-tiles/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;

        # The upstream sets these per object at upload time -- a year and immutable for a
        # tile, no-cache for a manifest -- so they are passed through rather than overridden.
        # Overriding here would be the one place able to make an immutable tile revalidate on
        # every load, which is the exact cost tiles exist to remove.
        proxy_pass_request_headers on;

        # A tile that is not there is a real answer: the client falls back to /getbars for any
        # window the tiles do not cover, so this must 404 rather than fall through to the SPA
        # below and hand back index.html with a 200.
        proxy_intercept_errors off;
    }

    # index.html is the only unhashed file, and it is what points at the current hashes —
    # caching it is what would pin a browser to a stale deployment.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
